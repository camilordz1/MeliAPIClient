name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          unexpected = [
              name
              for name in names
              if not (
                  name.startswith("meli_sdk/")
                  or (name.startswith("meli_sdk-") and ".dist-info/" in name)
              )
          ]
          print("unexpected wheel entries:", unexpected)
          sys.exit(1 if unexpected else 0)
          PY
      - name: Smoke-test wheel in a clean venv
        run: |
          python -m venv /tmp/msdk-check
          /tmp/msdk-check/bin/pip install -q dist/*.whl
          /tmp/msdk-check/bin/python -c "import importlib.metadata as m, meli_sdk as s; assert m.version('meli-sdk') == s.__version__, (m.version('meli-sdk'), s.__version__)"

  shim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build main package
        run: |
          pip install build
          python -m build
      - name: Build legacy shim
        run: python -m build legacy-shim
      - name: Install both wheels in a clean venv
        run: |
          python -m venv /tmp/msdk-shim-check
          /tmp/msdk-shim-check/bin/pip install -q dist/*.whl legacy-shim/dist/*.whl
      - name: Smoke-test the shim
        run: /tmp/msdk-shim-check/bin/python -W ignore::FutureWarning -c "from MeliAPIClient import MeliClient; import MeliAPIClient.client"
